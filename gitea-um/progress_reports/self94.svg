<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" role="img" aria-labelledby="title desc"><title id="title">Same 94 queries, before and after mask repair</title><desc id="desc">Before repair: 62 correct, 17 wrong, 15 failed. After repair: 66 correct, 25 wrong, 3 failed.</desc><rect width="820" height="180" fill="#f7fafb" rx="12"/><g font-family="sans-serif" fill="#163b41"><text x="20" y="30" font-size="19" font-weight="bold">Mask repair traded failed crops for both correct and wrong matches</text><text x="20" y="77" font-size="16">Raw</text><rect x="120" y="60" width="434" height="26" fill="#246755"/><text x="337.0" y="78" fill="white" font-size="14" text-anchor="middle">62</text><rect x="554" y="60" width="119" height="26" fill="#a03931"/><text x="613.5" y="78" fill="white" font-size="14" text-anchor="middle">17</text><rect x="673" y="60" width="105" height="26" fill="#515d6c"/><text x="725.5" y="78" fill="white" font-size="14" text-anchor="middle">15</text><text x="20" y="125" font-size="16">Repaired</text><rect x="120" y="108" width="462" height="26" fill="#246755"/><text x="351.0" y="126" fill="white" font-size="14" text-anchor="middle">66</text><rect x="582" y="108" width="175" height="26" fill="#a03931"/><text x="669.5" y="126" fill="white" font-size="14" text-anchor="middle">25</text><rect x="757" y="108" width="21" height="26" fill="#515d6c"/><text x="767.5" y="126" fill="white" font-size="14" text-anchor="middle">3</text><text x="120" y="161" font-size="14">Left to right: correct · wrong · no crop. Total = 94 per row.</text></g></svg>
